# CLIMAFORGE Alembic Migration Configuration

[alembic]
# Path to migration environment directory
script_location = %(here)s/alembic

# Sys.path prepending
prepend_sys_path = .
path_separator = os

# Output encoding
output_encoding = utf-8

# Default database URL (overridden dynamically by app.config.settings.database_url in env.py)
sqlalchemy.url = sqlite:///./climaforge.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
